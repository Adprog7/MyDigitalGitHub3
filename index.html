<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Simple</title>
    <style>
        /* Styles CSS pour le calendrier */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calendar-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            width: 350px; /* Largeur fixe pour le calendrier */
            text-align: center;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #333;
        }

        .calendar-header button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }

        .calendar-header button:hover {
            background-color: #0056b3;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7 colonnes pour les jours de la semaine */
            gap: 5px;
        }

        .calendar-grid div {
            padding: 10px 5px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .day-name {
            background-color: #e2e6ea;
            color: #555;
            font-size: 0.85em !important;
        }

        .day {
            background-color: #f8f9fa;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .day:hover:not(.current-day):not(.empty) {
            background-color: #e9ecef;
        }

        .current-day {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        .empty {
            background-color: #f4f4f9;
            cursor: default;
        }

        .empty:hover {
            background-color: #f4f4f9; /* Pas de changement au survol pour les jours vides */
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prevMonth">Précédent</button>
            <h2 id="currentMonthYear">Mois Année</h2>
            <button id="nextMonth">Suivant</button>
        </div>
        <div class="calendar-grid">
            <div class="day-name">Lun</div>
            <div class="day-name">Mar</div>
            <div class="day-name">Mer</div>
            <div class="day-name">Jeu</div>
            <div class="day-name">Ven</div>
            <div class="day-name">Sam</div>
            <div class="day-name">Dim</div>
            </div>
    </div>

    <script>
        // JavaScript pour la logique du calendrier
        const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
                            "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

        let currentDate = new Date(); // Date actuelle
        let currentMonth = currentDate.getMonth(); // Mois actuel (0-11)
        let currentYear = currentDate.getFullYear(); // Année actuelle

        const currentMonthYearHeader = document.getElementById('currentMonthYear');
        const calendarGrid = document.querySelector('.calendar-grid');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');

        // Fonction pour afficher le calendrier
        function renderCalendar() {
            calendarGrid.querySelectorAll('.day:not(.day-name)').forEach(day => day.remove()); // Supprime les anciens jours

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // Nombre de jours dans le mois
            const firstDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7; // Jour de la semaine (0 pour Lundi, 6 pour Dimanche)

            currentMonthYearHeader.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Ajoute les jours vides au début du mois
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.classList.add('day', 'empty');
                calendarGrid.appendChild(emptyDay);
            }

            // Ajoute les jours du mois
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.classList.add('day');
                dayElement.textContent = day;

                // Met en surbrillance le jour actuel (si c'est le mois et l'année en cours)
                if (day === currentDate.getDate() && currentMonth === currentDate.getMonth() && currentYear === currentDate.getFullYear()) {
                    dayElement.classList.add('current-day');
                }

                calendarGrid.appendChild(dayElement);
            }
        }

        // Événements pour la navigation
        prevMonthBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        // Affiche le calendrier au chargement de la page
        renderCalendar();
    </script>

</body>
</html>
